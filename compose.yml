name: uts-devops

services:
  frontend:
    build: 
      context: /frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: uts-devops-frontend
    restart: always
    ports:
      - '8000:80'
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: uts-devops-backend
    restart: always
    ports:
      - '8001:3000'
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: mysql:latest
    container_name: uts-devops-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - '8002:3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_PASSWORD}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
    name: uts-devops-db-data

networks:
  app-network:
    driver: bridge